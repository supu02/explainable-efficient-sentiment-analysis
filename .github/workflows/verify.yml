name: Verify portfolio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-and-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source, evidence, and documentation links
        run: python scripts/verify_portfolio.py
